name: Promote Approved PR to QA

env:
  PR_BASE_BRANCH: main
  QA_TARGET_BRANCH: qa
  TEMP_BYPASS_CI: "false"

on:
  pull_request_review:
    types:
      - submitted

  workflow_run:
    workflows:
      - CI Build and Test
    types:
      - completed

  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to promote manually"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: promote-to-qa
  cancel-in-progress: false

jobs:
  promote:
    name: Promote PR to QA
    runs-on: windows-latest

    steps:
      - name: Determine PR number
        id: pr
        shell: pwsh
        run: |
          $prNumber = ""

          if ("${{ github.event_name }}" -eq "pull_request_review") {
            $prNumber = "${{ github.event.pull_request.number }}"
          }

          if ("${{ github.event_name }}" -eq "workflow_run") {
            if ("${{ github.event.workflow_run.event }}" -ne "pull_request") {
              Write-Host "CI run did not originate from a pull request."
              "found=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              exit 0
            }

            $prNumber = "${{ github.event.workflow_run.pull_requests[0].number }}"
          }

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $prNumber = "${{ inputs.pr_number }}"
          }

          if ([string]::IsNullOrWhiteSpace($prNumber)) {
            Write-Host "No pull request found for this event."
            "found=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          Write-Host "PR Number: $prNumber"
          "found=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "number=$prNumber" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Read PR information
        if: steps.pr.outputs.found == 'true'
        id: prinfo
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: pwsh
        run: |
          $pr = gh api "repos/${{ github.repository }}/pulls/$env:PR_NUMBER" | ConvertFrom-Json

          Write-Host "PR #$env:PR_NUMBER"
          Write-Host "State : $($pr.state)"
          Write-Host "Base  : $($pr.base.ref)"
          Write-Host "Head  : $($pr.head.ref)"
          Write-Host "SHA   : $($pr.head.sha)"

          if ($pr.state -ne "open") {
            Write-Host "PR is not open."
            "eligible=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          if ($pr.base.ref -ne "$env:PR_BASE_BRANCH") {
            Write-Host "PR target '$($pr.base.ref)' does not match '$env:PR_BASE_BRANCH'."
            "eligible=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          if ($pr.head.repo.full_name -ne "${{ github.repository }}") {
            Write-Host "PR comes from a fork. Automatic QA promotion is disabled."
            "eligible=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          "eligible=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "branch=$($pr.head.ref)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha=$($pr.head.sha)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Check build-and-test
        if: steps.prinfo.outputs.eligible == 'true'
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.prinfo.outputs.sha }}
        shell: pwsh
        run: |
          if ($env:TEMP_BYPASS_CI -eq "true") {
            Write-Warning "TEMPORARY MODE: build-and-test is bypassed."
            "ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          $response = gh api `
            -H "Accept: application/vnd.github+json" `
            "repos/${{ github.repository }}/commits/$env:HEAD_SHA/check-runs" |
            ConvertFrom-Json

          $check = $response.check_runs |
            Where-Object { $_.name -eq "build-and-test" } |
            Sort-Object completed_at -Descending |
            Select-Object -First 1

          if ($null -eq $check) {
            Write-Host "Required check 'build-and-test' was not found."
            "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          Write-Host "build-and-test status     : $($check.status)"
          Write-Host "build-and-test conclusion : $($check.conclusion)"

          if ($check.status -eq "completed" -and $check.conclusion -eq "success") {
            "ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          else {
            "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Check two Lead approvals
        if: steps.prinfo.outputs.eligible == 'true'
        id: approvals
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          LEAD_APPROVERS: ${{ vars.LEAD_APPROVERS }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LEAD_APPROVERS)) {
            Write-Error "Repository variable LEAD_APPROVERS is not configured."
            exit 1
          }

          $allowedLeads = @(
            $env:LEAD_APPROVERS -split "," |
            ForEach-Object { $_.Trim().ToLower() } |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          )

          Write-Host "Configured Leads:"
          $allowedLeads | ForEach-Object { Write-Host " - $_" }

          $reviews = gh api `
            --paginate `
            "repos/${{ github.repository }}/pulls/$env:PR_NUMBER/reviews" |
            ConvertFrom-Json

          $latestByLead = @{}

          foreach ($review in ($reviews | Sort-Object submitted_at)) {
            $login = $review.user.login.ToLower()
            if ($allowedLeads -contains $login) {
              $latestByLead[$login] = $review.state
            }
          }

          $approvedLeads = @(
            $latestByLead.GetEnumerator() |
            Where-Object { $_.Value -eq "APPROVED" } |
            ForEach-Object { $_.Key }
          )

          Write-Host "Approved Leads:"
          $approvedLeads | ForEach-Object { Write-Host " - $_" }
          Write-Host "Approved Lead count: $($approvedLeads.Count)"

          if ($approvedLeads.Count -ge 2) {
            "ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          else {
            "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Show gate result
        if: steps.prinfo.outputs.eligible == 'true'
        shell: pwsh
        run: |
          Write-Host "PR Base Branch   : $env:PR_BASE_BRANCH"
          Write-Host "QA Target Branch : $env:QA_TARGET_BRANCH"
          Write-Host "CI Ready         : ${{ steps.ci.outputs.ready }}"
          Write-Host "2 Lead Approvals : ${{ steps.approvals.outputs.ready }}"

      - name: Checkout QA
        if: >
          steps.prinfo.outputs.eligible == 'true' &&
          steps.ci.outputs.ready == 'true' &&
          steps.approvals.outputs.ready == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.QA_TARGET_BRANCH }}
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure Git
        if: >
          steps.prinfo.outputs.eligible == 'true' &&
          steps.ci.outputs.ready == 'true' &&
          steps.approvals.outputs.ready == 'true'
        shell: pwsh
        run: |
          git config user.name "qa-promotion-bot"
          git config user.email "qa-promotion-bot@users.noreply.github.com"

      - name: Check whether PR version is already in QA
        if: >
          steps.prinfo.outputs.eligible == 'true' &&
          steps.ci.outputs.ready == 'true' &&
          steps.approvals.outputs.ready == 'true'
        id: already
        env:
          HEAD_SHA: ${{ steps.prinfo.outputs.sha }}
        shell: pwsh
        run: |
          git fetch origin "$env:QA_TARGET_BRANCH"

          git merge-base `
            --is-ancestor `
            "$env:HEAD_SHA" `
            "origin/$env:QA_TARGET_BRANCH"

          if ($LASTEXITCODE -eq 0) {
            Write-Host "Current PR commit is already contained in $env:QA_TARGET_BRANCH."
            "value=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          else {
            Write-Host "Current PR commit has not yet been promoted."
            "value=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

          exit 0

      - name: Promote feature branch to QA
        if: >
          steps.prinfo.outputs.eligible == 'true' &&
          steps.ci.outputs.ready == 'true' &&
          steps.approvals.outputs.ready == 'true' &&
          steps.already.outputs.value != 'true'
        env:
          FEATURE_BRANCH: ${{ steps.prinfo.outputs.branch }}
          HEAD_SHA: ${{ steps.prinfo.outputs.sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: pwsh
        run: |
          Write-Host "Promoting PR #$env:PR_NUMBER"
          Write-Host "Feature branch : $env:FEATURE_BRANCH"
          Write-Host "PR head SHA    : $env:HEAD_SHA"
          Write-Host "Target branch  : $env:QA_TARGET_BRANCH"

          git fetch origin
          git checkout "$env:QA_TARGET_BRANCH"
          git reset --hard "origin/$env:QA_TARGET_BRANCH"

          git merge `
            "$env:HEAD_SHA" `
            --no-ff `
            -m "Promote PR #$env:PR_NUMBER to $env:QA_TARGET_BRANCH"

          if ($LASTEXITCODE -ne 0) {
            git merge --abort 2>$null
            Write-Error "Merge conflict or merge failure while promoting PR #$env:PR_NUMBER."
            exit 1
          }

          git push origin "HEAD:$env:QA_TARGET_BRANCH"

      - name: Comment on original PR
        if: >
          steps.prinfo.outputs.eligible == 'true' &&
          steps.ci.outputs.ready == 'true' &&
          steps.approvals.outputs.ready == 'true' &&
          steps.already.outputs.value != 'true' &&
          success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.prinfo.outputs.sha }}
        shell: pwsh
        run: |
          $shortSha = $env:HEAD_SHA.Substring(0, 7)

          gh pr comment `
            $env:PR_NUMBER `
            --repo "${{ github.repository }}" `
            --body "✅ CI passed and 2 Lead approvals were received. Commit ``$shortSha`` has been promoted to ``$env:QA_TARGET_BRANCH``. The original PR remains open against ``$env:PR_BASE_BRANCH`` for QA testing and final approval."
